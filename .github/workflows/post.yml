name: LinkedIn Cybersec Autopilot

on:
  schedule:
    - cron: '0 9 * * 1,3,5'   # Mon / Wed / Fri at 9am UTC
  workflow_dispatch:            # Run manually anytime from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # So the bot can commit post archives
      issues: write             # So the bot can open failure-notification issues

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic google-genai requests python-dotenv

      - name: Research topic + write post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/research.py

      - name: Generate image with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gen_image.py

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python scripts/publish.py

      - name: Archive post
        run: |
          git config user.name "linkedin-bot"
          git config user.email "bot@noreply"
          git add posts/
          git diff --staged --quiet || git commit -m "📝 Auto-post $(date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Autopilot failed – ${new Date().toISOString().slice(0,10)}`,
              body: [
                '### LinkedIn Cybersec Autopilot — pipeline failure',
                '',
                `**Run:** [View logs](${run_url})`,
                `**Date:** ${new Date().toISOString().slice(0,10)}`,
                '',
                'Check the run logs above to see which step failed.',
                'Common causes: expired LinkedIn token, API key issue, image generation failure.',
              ].join('\n'),
              labels: ['bug', 'autopilot'],
            });
